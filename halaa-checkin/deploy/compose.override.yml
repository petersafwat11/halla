# Optional self-hosted production database. Copy alongside compose.yml on VPS.
# Compose loads this automatically. No MongoDB port is published.
services:
  checkin-api:
    networks:
      checkin_database: {}
  checkin-mongo:
    image: mongo:7.0
    restart: unless-stopped
    command: [mongod, --replSet, checkin-rs, --bind_ip_all, --keyFile, /run/checkin/keyfile, --wiredTigerCacheSizeGB, '0.5']
    volumes:
      - checkin_mongo_data:/data/db
      - ./secrets/keyfile:/run/checkin/keyfile:ro
      - ./secrets/mongo-admin.json:/run/checkin/admin.json:ro
    networks:
      checkin_database: {}
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, 'quit(db.hello().isWritablePrimary ? 0 : 1)']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 1536M }
networks:
  checkin_database:
    internal: true
volumes:
  checkin_mongo_data:
