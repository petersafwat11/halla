name: labbe-backend

on:
  pull_request:
    paths:
      - "labbe-backend-/**"
      - ".github/workflows/labbe-backend.yml"
  push:
    branches: [master]
    paths:
      - "labbe-backend-/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labbe-backend-
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install (workspaces from repo root)
        working-directory: .
        run: npm install --no-audit --no-fund
      - name: Boot smoke (load main entry without listening)
        run: node -e "require('./src/app.js')" || node -e "require('./src/server.js')"
        env:
          NODE_ENV: test
          # Backend won't actually connect — module load only validates require graph.
          DRY_RUN: "true"
