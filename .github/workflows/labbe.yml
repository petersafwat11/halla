name: labbe (web)

on:
  pull_request:
    paths:
      - "labbe/**"
      - "shared/**"
      - ".github/workflows/labbe.yml"
  push:
    branches: [master]
    paths:
      - "labbe/**"
      - "shared/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labbe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install (workspaces from repo root)
        working-directory: .
        run: npm install --no-audit --no-fund
      # Phase 9 lock-in: lint @halla/shared first so a regression there fails
      # the labbe pipeline (shared is in labbe's `paths:` trigger).
      - name: Lint @halla/shared
        working-directory: shared
        run: npm run lint
      - name: Lint labbe
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
