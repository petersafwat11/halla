name: halaa-web

on:
  pull_request:
    paths:
      - "halaa-web/**"
      - "shared/**"
      - ".github/workflows/halaa-web.yml"
  push:
    branches: [master]
    paths:
      - "halaa-web/**"
      - "shared/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: halaa-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install (workspaces from repo root)
        working-directory: .
        run: npm install --no-audit --no-fund
      # Lint the shared package first so a regression there fails this pipeline
      # (shared/ is in halaa-web's paths: trigger).
      - name: Lint shared
        working-directory: shared
        run: npm run lint
      - name: Lint halaa-web
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
