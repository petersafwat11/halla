name: halaa-mobile-direction-visual

on:
  workflow_dispatch:

jobs:
  screenshots:
    name: ${{ matrix.platform }} Arabic + English screenshots
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-15
    env:
      EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
      EXPO_NO_TELEMETRY: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Maestro
        shell: bash
        run: curl -Ls "https://get.maestro.mobile.dev" | bash
      - name: Build visual-test binary
        id: eas
        working-directory: halaa-mobile
        shell: bash
        run: |
          npx --yes eas-cli build --platform "${{ matrix.platform }}" --profile visual-test --non-interactive --wait --json > eas-build.json
          BUILD_URL=$(node -p "JSON.parse(require('fs').readFileSync('eas-build.json','utf8'))[0].artifacts.buildUrl")
          echo "url=$BUILD_URL" >> "$GITHUB_OUTPUT"

      - name: Run Android direction screenshots
        if: matrix.platform == 'android'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          BUILD_URL: ${{ steps.eas.outputs.url }}
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            cd halaa-mobile
            curl -L "$BUILD_URL" -o "$RUNNER_TEMP/halaa-visual.apk"
            adb install -r "$RUNNER_TEMP/halaa-visual.apk"
            "$HOME/.maestro/bin/maestro" test .maestro/direction-ar.yaml --test-output-dir=.maestro/artifacts
            "$HOME/.maestro/bin/maestro" test .maestro/direction-en.yaml --test-output-dir=.maestro/artifacts

      - name: Run iOS direction screenshots
        if: matrix.platform == 'ios'
        working-directory: halaa-mobile
        shell: bash
        env:
          BUILD_URL: ${{ steps.eas.outputs.url }}
        run: |
          IOS_RUNTIME=$(xcrun simctl list runtimes available -j | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s).runtimes.filter(x=>x.platform==='iOS').at(-1);process.stdout.write(r.identifier)})")
          DEVICE_ID=$(xcrun simctl create HalaaVisual com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$IOS_RUNTIME")
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          curl -L "$BUILD_URL" -o "$RUNNER_TEMP/halaa-visual.tar.gz"
          mkdir -p "$RUNNER_TEMP/halaa-visual-app"
          tar -xzf "$RUNNER_TEMP/halaa-visual.tar.gz" -C "$RUNNER_TEMP/halaa-visual-app"
          APP_PATH=$(find "$RUNNER_TEMP/halaa-visual-app" -maxdepth 2 -name '*.app' -print -quit)
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          "$HOME/.maestro/bin/maestro" --device "$DEVICE_ID" test .maestro/direction-ar.yaml --test-output-dir=.maestro/artifacts
          "$HOME/.maestro/bin/maestro" --device "$DEVICE_ID" test .maestro/direction-en.yaml --test-output-dir=.maestro/artifacts

      - name: Upload screenshots and Maestro reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direction-${{ matrix.platform }}
          path: halaa-mobile/.maestro/artifacts
          if-no-files-found: error
