        - generic [ref=e330]:
          - generic [ref=e331]:
            - button "How do I create a new invitation?" [ref=e332] [cursor=pointer]:
              - generic [ref=e333]: How do I create a new invitation?
              - img [ref=e335]
            - region:
              - generic [ref=e337]: "Create your event in four easy steps: First, add your event details — name, venue, date, and time, with a location pin on the map. Second, add guests one by one or import your full list from a CSV file in one click. Third, choose an invitation image from our library or upload your own and add any text you like. Fourth, select a WhatsApp message template, review all your event details, send yourself a test message to see what your guests will receive, then schedule the send time — we'll deliver all invitations at your chosen moment with an automatic reminder 24 hours before the event."
          - generic [ref=e338]:
            - button "Can I add my own custom design?" [ref=e339] [cursor=pointer]:
              - generic [ref=e340]: Can I add my own custom design?
              - img [ref=e342]
            - region:
              - generic [ref=e344]: Absolutely. You can upload your own designs or choose from our premium template library and customize them with your preferred colors and text, or request professional design services through the 'Halla Marketplace' by connecting directly with one of our talented designers.
          - generic [ref=e345]:
            - button "Can I see attendance and RSVP details?" [ref=e346] [cursor=pointer]:
              - generic [ref=e347]: Can I see attendance and RSVP details?
              - img [ref=e349]
            - region:
              - generic [ref=e351]: Yes, your dashboard shows in real time who accepted, who declined, and who hasn't responded yet, with comprehensive exportable detailed reports.
          - generic [ref=e352]:
            - button "Can I send reminders to guests?" [ref=e353] [cursor=pointer]:
              - generic [ref=e354]: Can I send reminders to guests?
              - img [ref=e356]
            - region:
              - generic [ref=e358]: Yes, Halla automatically sends a WhatsApp reminder to every guest 24 hours before the event — no action needed from you.
          - generic [ref=e359]:
            - button "What about guests who don't use WhatsApp?" [ref=e360] [cursor=pointer]:
              - generic [ref=e361]: What about guests who don't use WhatsApp?
              - img [ref=e363]
            - region:
              - generic [ref=e365]: Halla sends invitations via WhatsApp by default. If a WhatsApp message doesn't reach a guest for any reason, the system automatically falls back to SMS to ensure the invitation is delivered.
          - generic [ref=e366]:
            - button "Can I invite guests from outside Saudi Arabia?" [ref=e367] [cursor=pointer]:
              - generic [ref=e368]: Can I invite guests from outside Saudi Arabia?
              - img [ref=e370]
            - region:
              - generic [ref=e372]: Currently, the Halla platform and app support sending invitations to mobile numbers within Saudi Arabia only.
          - generic [ref=e373]:
            - button "Can I assign more than one additional host?" [ref=e374] [cursor=pointer]:
              - generic [ref=e375]: Can I assign more than one additional host?
              - img [ref=e377]
            - region:
              - generic [ref=e379]: Yes, you can add one or more co-hosts to your event, allowing them to send invitations and track guest responses on your behalf.
          - generic [ref=e380]:
            - button "What is the compensation credit system?" [ref=e381] [cursor=pointer]:
              - generic [ref=e382]: What is the compensation credit system?
              - img [ref=e384]
            - region:
              - generic [ref=e386]: Compensation credits are extra invite slots granted on top of your plan's guest count. When a guest declines, you can use these credits to invite someone else in their place and ensure your event is fully attended.
          - generic [ref=e387]:
            - button "Is my data safe with Halla?" [ref=e388] [cursor=pointer]:
              - generic [ref=e389]: Is my data safe with Halla?
              - img [ref=e391]
            - region:
              - generic [ref=e393]: Yes, we use the highest security and encryption standards to protect your data and your guests' data, in accordance with international best practices and data protection regulations.
          - generic [ref=e394]:
            - button "Can I try the Halla platform for free?" [ref=e395] [cursor=pointer]:
              - generic [ref=e396]: Can I try the Halla platform for free?
              - img [ref=e398]
            - region:
              - generic [ref=e400]: Yes, you can create a new account for free and try the platform with a limited number of trial invitations.
          - generic [ref=e401]:
            - button "Can I cancel my subscription at any time?" [ref=e402] [cursor=pointer]:
              - generic [ref=e403]: Can I cancel my subscription at any time?
              - img [ref=e405]
            - region:
