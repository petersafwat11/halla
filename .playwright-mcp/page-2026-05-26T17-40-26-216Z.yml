          - generic [ref=e218]:
            - paragraph [ref=e219]: Publish incredibly high performance websites and applications right from GitHub. The Netlify platform connects your repositories to an all-in-one workflow for global CDN deployment, continuous integration, and automatic (and free) HTTPS. Each time you commit changes, Netlify builds your site, prerenders markup, and optimizes assets on dedicated build infrastructure. Easily create an entirely automated workflows for your web applications
            - heading "Features" [level=2] [ref=e220]
            - heading "Push your site live, directly from GitHub" [level=3] [ref=e221]
            - paragraph [ref=e222]: Deploy your site to an ultra-redundant global CDN that’s purpose built for serving pages and assets quickly and consistently.
            - heading "Automate deployment" [level=3] [ref=e223]
            - paragraph [ref=e224]: Netlify’s built-in Continuous Deployment automatically runs your build commands and deploys the result whenever you push to your Git repository.
            - heading "Add a custom domain" [level=3] [ref=e225]
            - paragraph [ref=e226]: Purchase domains and manage DNS zones and records right inside of Netlify.
            - heading "HTTPS is automatic" [level=3] [ref=e227]
            - paragraph [ref=e228]: Your site will automatically be secured with a free TLS certificate from Let’s Encrypt.
            - heading "Deploy Previews" [level=3] [ref=e229]
            - paragraph [ref=e230]: Netlify’s Deploy Previews streamlined your workflow by giving you a unique, permanent URL to check what your changes will be like in production whenever you submit a pull request.
            - heading "And a lot more!" [level=3] [ref=e231]
            - paragraph [ref=e232]: Netlify includes solutions for forms, identity, and even custom functions powered by AWS Lambda. And all this functionality can be configured directly in your repo.
