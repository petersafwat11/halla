      - generic [ref=e502]:
        - generic [ref=e504]: FAQ
        - generic [ref=e505]:
          - generic [ref=e506]:
            - button "What is Halla?" [ref=e507] [cursor=pointer]:
              - generic [ref=e508]: What is Halla?
              - img [ref=e510]
            - region:
              - generic [ref=e512]: Halla is a smart event management platform that lets you create events, send digital invitations via WhatsApp and SMS, and track attendance in real time — all from one place.
          - generic [ref=e513]:
            - button "How do I create a new invitation?" [ref=e514] [cursor=pointer]:
              - generic [ref=e515]: How do I create a new invitation?
              - img [ref=e517]
            - region:
              - generic [ref=e519]: "Creating an event takes four simple steps: First, add your event details — name, venue, date, time, and drop a pin on the map. Second, add guests one by one or import your full guest list from a CSV file instantly. Third, choose an invitation image from our gallery or upload your own and add custom text. Fourth, select a WhatsApp message template, review your event summary, send yourself a test message to preview what guests will receive, then schedule the send time — we'll deliver all invitations at your chosen moment and automatically send reminders 24 hours before the event."
          - generic [ref=e520]:
            - button "Are invitations sent with each guest's personal name?" [ref=e521] [cursor=pointer]:
              - generic [ref=e522]: Are invitations sent with each guest's personal name?
              - img [ref=e524]
            - region:
              - generic [ref=e526]: Yes, every guest receives a personalized message with their name, event details, and a unique QR code that belongs exclusively to them.
          - generic [ref=e527]:
            - button "Do all invitations reach their recipients?" [ref=e528] [cursor=pointer]:
              - generic [ref=e529]: Do all invitations reach their recipients?
              - img [ref=e531]
            - region:
              - generic [ref=e533]: Yes, Halla ensures delivery via WhatsApp with the ability to track delivery status for each guest. You'll be notified immediately if any message fails.
          - generic [ref=e534]:
            - button "Can I add my own custom design?" [ref=e535] [cursor=pointer]:
              - generic [ref=e536]: Can I add my own custom design?
              - img [ref=e538]
            - region:
              - generic [ref=e540]: Absolutely. You can upload your own designs or choose from our professional template library and customize them with your colors and text.
          - generic [ref=e541]:
            - button "Can I see attendance and regret details?" [ref=e542] [cursor=pointer]:
              - generic [ref=e543]: Can I see attendance and regret details?
              - img [ref=e545]
            - region:
              - generic [ref=e547]: Yes, your dashboard shows in real time who accepted, declined, or hasn't replied, with comprehensive exportable reports.
          - generic [ref=e548]:
            - button "Can I send reminders to guests?" [ref=e549] [cursor=pointer]:
              - generic [ref=e550]: Can I send reminders to guests?
              - img [ref=e552]
            - region:
              - generic [ref=e554]: Yes, Halla automatically sends a WhatsApp reminder to every guest 24 hours before the event — no action needed from you.
          - generic [ref=e555]:
            - button "What about guests who don't use WhatsApp?" [ref=e556] [cursor=pointer]:
              - generic [ref=e557]: What about guests who don't use WhatsApp?
              - img [ref=e559]
            - region:
              - generic [ref=e561]: Halla sends invitations via WhatsApp by default. If a WhatsApp message doesn't reach a guest for any reason, the system automatically falls back to SMS to ensure delivery.
          - generic [ref=e562]:
            - button "Can I invite guests from outside Saudi Arabia?" [ref=e563] [cursor=pointer]:
              - generic [ref=e564]: Can I invite guests from outside Saudi Arabia?
              - img [ref=e566]
            - region:
              - generic [ref=e568]: Yes, Halla supports sending invitations to mobile numbers across all Gulf Cooperation Council countries — Saudi Arabia, UAE, Kuwait, Qatar, Bahrain, and Oman.
          - generic [ref=e569]:
            - button "Can I assign more than one additional host?" [ref=e570] [cursor=pointer]:
              - generic [ref=e571]: Can I assign more than one additional host?
              - img [ref=e573]
            - region:
              - generic [ref=e575]: Yes, you can add one or more co-hosts to your event. They'll be able to send invitations and track guest RSVPs on your behalf.
          - generic [ref=e576]:
            - button "How does QR check-in work?" [ref=e577] [cursor=pointer]:
              - generic [ref=e578]: How does QR check-in work?
              - img [ref=e580]
            - region:
              - generic [ref=e582]: Each guest receives a unique QR code in their invitation. On event day, your team scans the code with a phone camera and the guest's details appear instantly.
          - generic [ref=e583]:
            - button "What is the compensation credit system?" [ref=e584] [cursor=pointer]:
              - generic [ref=e585]: What is the compensation credit system?
              - img [ref=e587]
            - region:
              - generic [ref=e589]: Compensation credits are extra invite slots added on top of your plan's guest count. When a guest declines your invitation, you can use these credits to invite someone else in their place — keeping your event full.
          - generic [ref=e590]:
            - button "Is my data safe with Halla?" [ref=e591] [cursor=pointer]:
              - generic [ref=e592]: Is my data safe with Halla?
              - img [ref=e594]
            - region:
              - generic [ref=e596]: Yes, we use the highest security and encryption standards to protect your data and your guests' data, in line with international best practices and data protection regulations.
          - generic [ref=e597]:
